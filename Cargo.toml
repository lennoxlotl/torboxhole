[package]
name = "torboxhole"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.48.0", features = ["full"] }
reqwest = { version = "0.12.24", features = ["json", "multipart", "stream"] }
chrono = { version = "0.4.42", features = ["serde"] }
serde = "1.0.228"
serde_json = "1.0.145"
eyre = "0.6.12"
log = "0.4.28"
pretty_env_logger = "0.5.0"