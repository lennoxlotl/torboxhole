[package]
name = "tbh-torbox"
description = "Simple TorBox SDK built for torboxhole"
version = "0.1.0"
edition = "2024"
authors = ["Lennox Schneider <admin@lennoxlotl.dev>"]

[dependencies]
reqwest = { version = "0.12.24", features = ["json", "multipart", "stream"] }
chrono = { version = "0.4.42", features = ["serde"] }
serde = "1.0.228"
serde_json = "1.0.145"
eyre = "0.6.12"
log = "0.4.28"